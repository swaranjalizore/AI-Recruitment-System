{% extends "base.html" %}

{% block title %}
Candidate Registration
{% endblock %}

{% block content %}

<div class="container mt-5" style="max-width: 600px;">

    <div class="card shadow">

        <div class="card-header text-center">
            <h2>Candidate Registration</h2>
        </div>

        <div class="card-body">

            <form action="{{ url_for('candidate.register') }}" method="POST">

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input
                        type="text"
                        class="form-control"
                        name="full_name"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input
                        type="email"
                        class="form-control"
                        name="email"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input
                        type="text"
                        class="form-control"
                        name="phone"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input
                        type="password"
                        class="form-control"
                        name="password"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input
                        type="password"
                        class="form-control"
                        name="confirm_password"
                        required>
                </div>

                <div class="d-grid">

                    <button
                        type="submit"
                        class="btn btn-primary">

                        Register

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}

{% extends "base.html" %}

{% block title %}
Candidate Profile
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header text-center">
            <h2>Candidate Profile</h2>
        </div>

        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input
                        type="text"
                        class="form-control"
                        name="full_name"
                        value="{{ user.full_name }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input
                        type="email"
                        class="form-control"
                        name="email"
                        value="{{ user.email }}"
                        readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone</label>
                    <input
                        type="text"
                        class="form-control"
                        name="phone"
                        value="{{ user.phone }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Education</label>
                    <input
                        type="text"
                        class="form-control"
                        name="education"
                        value="{{ user.education }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Skills</label>
                    <textarea
                        class="form-control"
                        name="skills">{{ user.skills }}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Experience</label>
                    <input
                        type="number"
                        class="form-control"
                        name="experience"
                        value="{{ user.experience }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Location</label>
                    <input
                        type="text"
                        class="form-control"
                        name="location"
                        value="{{ user.location }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Upload Resume (PDF)</label>

                    <input
                        type="file"
                        name="resume"
                        class="form-control"
                        accept=".pdf"
                    >
                </div>

                {% if user.resume_file %}
                <p>
                    Current Resume:
                    {{ user.resume_file }}
                </p>
                {% endif %}

                <button class="btn btn-primary">
                    Save Profile
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}

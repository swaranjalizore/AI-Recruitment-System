{% extends "base.html" %}

{% block title %}
Candidate Dashboard
{% endblock %}

{% block content %}

<div class="container py-5">

```
<div class="card shadow-sm border-0">

    <div class="card-body p-4 p-md-5">

        <div class="text-center mb-5">

            <h1 class="fw-bold">
                Candidate Dashboard
            </h1>

            <p class="text-muted mt-2 mb-0">
                Welcome, {{ session["name"] }}
            </p>

        </div>

        <div class="row g-4">

            <div class="col-md-4">

                <a
                    href="{{ url_for('candidate.profile') }}"
                    class="btn btn-primary w-100 py-3"
                >
                    My Profile
                </a>

            </div>

            <div class="col-md-4">

                <a
                    href="{{ url_for('candidate.browse_jobs') }}"
                    class="btn btn-primary w-100 py-3"
                >
                    Browse Jobs
                </a>

            </div>

            <div class="col-md-4">

                <a
                    href="{{ url_for('candidate.applied_jobs') }}"
                    class="btn btn-primary w-100 py-3"
                >
                    Applied Jobs
                </a>

            </div>

        </div>

        <div class="text-center mt-5">

            <a
                href="{{ url_for('auth.logout') }}"
                class="btn btn-outline-danger px-4"
            >
                Logout
            </a>

        </div>

    </div>

</div>
```

</div>

{% endblock %}

{% extends "base.html" %}

{% block title %}
Recruiter Profile
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-sm border-0">

                <div class="card-header bg-primary text-white text-center py-3">

                    <h2 class="mb-0">
                        Recruiter Profile
                    </h2>

                </div>

                <div class="card-body p-4">

                    <form method="POST">

                        <div class="mb-3">

                            <label
                                for="company_name"
                                class="form-label fw-semibold"
                            >
                                Company Name
                            </label>

                            <input
                                type="text"
                                id="company_name"
                                name="company_name"
                                class="form-control"
                                value="{{ user.company_name }}"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label
                                for="hr_name"
                                class="form-label fw-semibold"
                            >
                                HR Name
                            </label>

                            <input
                                type="text"
                                id="hr_name"
                                name="hr_name"
                                class="form-control"
                                value="{{ user.hr_name }}"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label fw-semibold"
                            >
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-control"
                                value="{{ user.email }}"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label
                                for="phone"
                                class="form-label fw-semibold"
                            >
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                class="form-control"
                                value="{{ user.phone }}"
                                pattern="[0-9]{10}"
                                maxlength="10"
                                minlength="10"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label
                                for="company_location"
                                class="form-label fw-semibold"
                            >
                                Company Location
                            </label>

                            <input
                                type="text"
                                id="company_location"
                                name="company_location"
                                class="form-control"
                                value="{{ user.company_location or '' }}"
                            >

                        </div>

                        <div class="mb-4">

                            <label
                                for="designation"
                                class="form-label fw-semibold"
                            >
                                Designation
                            </label>

                            <input
                                type="text"
                                id="designation"
                                name="designation"
                                class="form-control"
                                value="{{ user.designation or '' }}"
                            >

                        </div>

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Update Profile
                            </button>

                            <a
                                href="{{ url_for('recruiter.dashboard') }}"
                                class="btn btn-outline-secondary"
                            >
                                Back to Dashboard
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
